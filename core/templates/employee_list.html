
<h1>List of employees</h1>

{% for employee in employees %}
    <p>
        <a href="{% url 'emp_detail' employee.id %}">{{ employee }}</a>
    </p>
{% endfor %}

<form method="GET" action="{% url 'search_emp' %}">
    <input
        type="text"
        name="q"
        placeholder="Search employees..."
    >
</form>
