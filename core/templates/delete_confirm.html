{% extends 'base.html' %}

{% block title %}Delete Employee{% endblock %}

{% block content %}
<h1>Delete Employee</h1>
<p>Are you sure you want to delete the employee <strong>{{ employee }}</strong>? </p>

<form method="POST">
    {% csrf_token %}
    <button type="submit">Yes</button>
</form>

<br>

<a href="{% url 'emp_detail' employee.id %}">Cancel</a>

{% endblock %}
